<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>馬桶打地鼠 · Toilet Whack-a-Mole</title>
<style>
:root{font-family:ui-rounded,"Microsoft JhengHei",system-ui,sans-serif;color:#294b59;background:#edf6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 8% 10%,#fff4dd 0,transparent 42%),radial-gradient(ellipse at 95% 90%,#fce5eb 0,transparent 44%),#edf6f8}button{font:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #327e97;outline-offset:4px}main{max-width:740px;margin:auto;padding:32px 22px;text-align:center}.eyebrow{letter-spacing:3px;font-size:11px;font-weight:800;color:#71909b}h1{font-size:clamp(28px,5vw,40px);margin:10px 0;color:#294b59;letter-spacing:2px}.intro{font-size:14px;color:#718791;margin:0 0 22px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}.stat{display:flex;align-items:center;justify-content:space-between;background:#ffffffc9;padding:14px 22px;border-radius:20px;border:1px solid white}.stat span{font-size:13px;color:#708892}.stat strong{font-size:29px;font-variant-numeric:tabular-nums}.stat small{font-size:12px;color:#8ba0a7;margin-left:4px}.board-wrap{position:relative}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px;background:#daeaf0;border:6px solid #fff;border-radius:30px;box-shadow:0 12px 32px #52768412}.hole{position:relative;aspect-ratio:1.2;border:0;border-radius:21px;background:#eaf3f5;overflow:hidden;user-select:none}.hole:hover{background:#f3f8f9}.toilet{position:absolute;width:88%;height:92%;left:6%;bottom:0;pointer-events:none}.animal-clip{position:absolute;inset:0 12% 37%;overflow:hidden;pointer-events:none}.animal{width:100%;height:100%;transform:translateY(110%);transition:transform .16s cubic-bezier(.2,.8,.3,1);pointer-events:none}.hole.up .animal{transform:translateY(3%)}.hole.hit .animal{transform:translateY(110%);transition-duration:.15s}.points{position:absolute;z-index:4;left:0;right:0;top:22%;color:#247c75;font-weight:900;font-size:25px;pointer-events:none;animation:float .65s both}@keyframes float{from{opacity:1;transform:translateY(0) scale(.8)}25%{transform:translateY(-6px) scale(1.1)}to{opacity:0;transform:translateY(-42px)}}.overlay{position:absolute;inset:6px;border-radius:24px;background:#edf5f5dc;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:10}.overlay[hidden]{display:none}.count{font-size:80px;font-weight:900;color:#377b89;text-shadow:3px 4px white}.result{padding:22px}.result .eyebrow{color:#6d969e}.result h2{font-size:27px;margin:12px 0}.result .total{font-size:56px;font-weight:900;color:#348a90;line-height:1.2}.result p{color:#6b838b;font-size:14px}.controls{margin-top:22px}.difficulties{display:flex;justify-content:center;gap:10px}.difficulty{padding:10px 24px;border:1px solid #d2e2e5;border-radius:13px;background:#ffffff96;color:#789099;font-weight:700}.difficulty[aria-pressed=true]{background:#d3eae9;border-color:#a1c9c7;color:#327771;box-shadow:0 2px 0 #abcfc9}.difficulty:disabled{cursor:default;opacity:.6}.difficulty[aria-pressed=true]:disabled{opacity:1}.detail{font-size:12px;color:#789098;min-height:18px;margin:13px 0}.start{background:#397f8d;border:0;border-radius:15px;padding:14px 44px;color:white;font-weight:800;box-shadow:0 5px 0 #2d6672;min-width:210px}.start:hover:enabled{background:#2e7382}.start:disabled{cursor:default;opacity:.65}.hint{margin-top:22px;color:#85979d;font-size:12px}.progress{height:5px;border-radius:3px;background:#c8dedf;margin:0 20px 16px;overflow:hidden}.progress i{display:block;width:100%;height:100%;background:#76b5b1;transition:width .1s linear}.low{color:#c36b68!important}@media(max-width:480px){main{padding:22px 12px}.board{padding:10px;gap:7px;border-width:4px;border-radius:24px}.hole{border-radius:14px}.stat{padding:12px 17px}.difficulty{padding:10px 20px}.intro{font-size:12px}.count{font-size:65px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="toilet" viewBox="0 0 160 150"><rect x="37" y="17" width="86" height="69" rx="15" fill="#d0e3e8"/><rect x="41" y="12" width="78" height="67" rx="13" fill="#fffdfa" stroke="#bfd5dc" stroke-width="3"/><rect x="94" y="25" width="13" height="6" rx="3" fill="#9bc2cb"/><path d="M54 104h52l-7 25 9 11H52l9-11z" fill="#e6f0f2" stroke="#b5d0d8" stroke-width="3"/><ellipse cx="80" cy="91" rx="57" ry="31" fill="#fffdfa" stroke="#b5d0d8" stroke-width="3"/><ellipse cx="80" cy="87" rx="43" ry="20" fill="#8cbbc6"/><ellipse cx="80" cy="90" rx="34" ry="13" fill="#afd9de"/><path d="M30 96q50 36 100 0" fill="none" stroke="#e3eef0" stroke-width="6" stroke-linecap="round"/></symbol>
<symbol id="mole" viewBox="0 0 120 110"><ellipse cx="29" cy="38" rx="14" ry="16" fill="#9b7564"/><ellipse cx="91" cy="38" rx="14" ry="16" fill="#9b7564"/><path d="M21 109V62a39 39 0 0 1 78 0v47" fill="#ba9279"/><ellipse cx="60" cy="80" rx="29" ry="24" fill="#e4c7a9"/><ellipse cx="45" cy="58" rx="4" ry="5" fill="#37464b"/><ellipse cx="75" cy="58" rx="4" ry="5" fill="#37464b"/><ellipse cx="60" cy="72" rx="9" ry="6" fill="#73564f"/><path d="M54 83q6 7 12 0" fill="none" stroke="#73564f" stroke-width="3" stroke-linecap="round"/><circle cx="33" cy="72" r="7" fill="#dfa08f"/><circle cx="87" cy="72" r="7" fill="#dfa08f"/><path d="M54 26l4-10 5 11" fill="#ba9279"/></symbol>
<symbol id="duck" viewBox="0 0 120 110"><path d="M20 110V61a40 40 0 0 1 80 0v49" fill="#f4d578"/><path d="M52 27q-8-23 7-12l5 10q11-18 14-5" fill="#f4d578" stroke="#f4d578" stroke-width="4"/><ellipse cx="44" cy="57" rx="4" ry="5" fill="#37464b"/><ellipse cx="76" cy="57" rx="4" ry="5" fill="#37464b"/><ellipse cx="60" cy="77" rx="22" ry="12" fill="#e99b55"/><path d="M43 76h34" stroke="#cc7c42" stroke-width="2"/><circle cx="30" cy="72" r="6" fill="#efb58a"/><circle cx="90" cy="72" r="6" fill="#efb58a"/></symbol>
<symbol id="seal" viewBox="0 0 120 110"><path d="M15 110Q8 24 60 25q52-1 45 85" fill="#d8e2e8"/><ellipse cx="60" cy="82" rx="32" ry="25" fill="#f6f7f3"/><ellipse cx="42" cy="58" rx="4" ry="5" fill="#37464b"/><ellipse cx="78" cy="58" rx="4" ry="5" fill="#37464b"/><path d="M53 70q7-6 14 0l-7 7z" fill="#52676f"/><path d="M60 77v5m0 0q-7 9-13 0m13 0q7 9 13 0M35 78l-16-4m16 11-17 2m67-9 16-4M85 85l17 2" fill="none" stroke="#748991" stroke-width="2.5" stroke-linecap="round"/><circle cx="29" cy="70" r="6" fill="#e8b8bd"/><circle cx="91" cy="70" r="6" fill="#e8b8bd"/></symbol>
</defs></svg>
<main>
<div class="eyebrow">A LITTLE BATHROOM BREAK</div><h1>馬桶打地鼠</h1><p class="intro">地鼠、鴨子、海豹探出頭了！看看你的手速有多快。</p>
<div class="stats"><div class="stat"><span>目前分數</span><div><strong id="score">0</strong><small>分</small></div></div><div class="stat"><span>剩餘時間</span><div><strong id="time">30</strong><small>秒</small></div></div></div>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<div class="board-wrap"><div class="board" id="board" aria-label="九宮格遊戲區"></div><div class="overlay" id="overlay" hidden><div id="overlayContent"></div></div></div>
<div class="controls"><div class="difficulties" role="group" aria-label="選擇難度"><button class="difficulty" data-level="easy" aria-pressed="false">簡單</button><button class="difficulty" data-level="normal" aria-pressed="true">普通</button><button class="difficulty" data-level="hard" aria-pressed="false">困難</button></div><p class="detail" id="detail"></p><button class="start" id="start">開始遊戲 →</button></div>
<p class="hint" id="status" aria-live="polite">點擊冒出的角色，每隻 +10 分。點空、漏接都不扣分。</p>
</main>
<script>
'use strict';
const settings={easy:{name:'簡單',cap:1,stay:1800,interval:1500},normal:{name:'普通',cap:2,stay:1200,interval:900},hard:{name:'困難',cap:3,stay:700,interval:500}};
const $=id=>document.getElementById(id), types=['mole','duck','seal'],names={mole:'地鼠',duck:'鴨子',seal:'海豹'};
let level='normal',state='idle',score=0,hits=0,spawned=0,deadline=0,tick=null,spawner=null,round=0;
const pending=new Set(),slots=[];
function later(fn,ms){const token=round;const id=setTimeout(()=>{pending.delete(id);if(token===round)fn()},ms);pending.add(id);return id}
function clearTimers(){clearInterval(tick);clearInterval(spawner);pending.forEach(clearTimeout);pending.clear();tick=spawner=null}
function resetSlots(){slots.forEach(s=>{s.active=false;s.button.className='hole';s.button.setAttribute('aria-label',`馬桶 ${s.index+1}，目前空置`);s.button.querySelectorAll('.points').forEach(p=>p.remove())})}
for(let i=0;i<9;i++){const b=document.createElement('button');b.className='hole';b.type='button';b.innerHTML='<svg class="toilet" aria-hidden="true"><use href="#toilet"/></svg><div class="animal-clip"><svg class="animal" viewBox="0 0 120 110" aria-hidden="true"><use href="#mole"/></svg></div>';const s={button:b,active:false,index:i,serial:0};slots.push(s);b.addEventListener('click',()=>hit(s));$('board').append(b)}resetSlots();
function selectLevel(value){if(state==='running'||state==='countdown')return;level=value;document.querySelectorAll('.difficulty').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.level===level)));const c=settings[level];$('detail').textContent=`停留 ${c.stay/1000} 秒 · 每 ${c.interval/1000} 秒出現 · 最多 ${c.cap} 隻`}
document.querySelectorAll('.difficulty').forEach(b=>b.addEventListener('click',()=>selectLevel(b.dataset.level)));selectLevel(level);
function lock(value){document.querySelectorAll('.difficulty').forEach(b=>b.disabled=value);$('start').disabled=value}
function drawTime(){const left=Math.max(0,deadline-performance.now());$('time').textContent=Math.ceil(left/1000);$('bar').style.width=(left/30000*100)+'%';$('time').classList.toggle('low',left<=5000);if(left<=0)finish()}
function spawn(){if(state!=='running')return;if(performance.now()>=deadline){finish();return}const c=settings[level],free=slots.filter(s=>!s.active&&!s.button.classList.contains('hit'));const count=Math.min(1+Math.floor(Math.random()*c.cap),c.cap-slots.filter(s=>s.active).length,free.length);for(let n=0;n<count;n++){const s=free.splice(Math.floor(Math.random()*free.length),1)[0],type=types[Math.floor(Math.random()*types.length)],serial=++s.serial;s.active=true;spawned++;s.button.querySelector('.animal use').setAttribute('href','#'+type);s.button.setAttribute('aria-label',`${names[type]}，點擊得 10 分`);s.button.classList.add('up');later(()=>{if(s.serial===serial&&s.active){s.active=false;s.button.classList.remove('up');s.button.setAttribute('aria-label',`馬桶 ${s.index+1}，目前空置`)}},c.stay)}}
function hit(s){if(state!=='running')return;if(performance.now()>=deadline){finish();return}if(!s.active)return;s.active=false;score+=10;hits++;$('score').textContent=score;s.button.classList.remove('up');s.button.classList.add('hit');s.button.setAttribute('aria-label',`馬桶 ${s.index+1}，已擊中`);const p=document.createElement('span');p.className='points';p.textContent='+10';s.button.append(p);later(()=>s.button.classList.remove('hit'),180);later(()=>p.remove(),650)}
function start(){if(state==='running'||state==='countdown')return;round++;clearTimers();resetSlots();score=hits=spawned=0;$('score').textContent='0';$('time').textContent='30';$('time').classList.remove('low');$('bar').style.width='100%';state='countdown';lock(true);$('start').textContent='準備中…';$('status').textContent='準備好了嗎？倒數結束後開始 30 秒挑戰。';$('overlay').hidden=false;const steps=['3','2','1','GO!'];function step(i){$('overlayContent').innerHTML='<div class="count">'+steps[i]+'</div>';later(()=>{if(i<3)step(i+1);else begin()},i===3?500:1000)}step(0)}
function begin(){state='running';$('overlay').hidden=true;$('start').textContent='挑戰進行中…';$('status').textContent='點擊冒出的角色，每隻 +10 分！';deadline=performance.now()+30000;spawn();spawner=setInterval(spawn,settings[level].interval);tick=setInterval(drawTime,50);drawTime()}
function finish(){if(state!=='running')return;state='ended';clearTimers();resetSlots();$('time').textContent='0';$('bar').style.width='0%';$('overlayContent').innerHTML=`<div class="result"><div class="eyebrow">NICE CATCH · 挑戰完成</div><h2>收工，沖個好成績！</h2><div class="total">${score}<span style="font-size:17px"> 分</span></div><p>${settings[level].name}難度 · 擊中 ${hits} 隻 / 出現 ${spawned} 隻</p></div>`;$('overlay').hidden=false;lock(false);$('start').textContent='再玩一次 ↻';$('status').textContent=`本局獲得 ${score} 分！按「再玩一次」沿用目前難度，也可以選擇其他難度。`}
$('start').addEventListener('click',start);
</script>
</body></html>
